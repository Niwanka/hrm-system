version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: hrm_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: hrm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hrm_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Go Fiber Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hrm_backend
    restart: always
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: hrm_db
      DB_PORT: 5432
      PORT: 8080
      JWT_SECRET: hrm-super-secret-docker-jwt-key
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # 3. Vue 3 Nginx Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hrm_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

  # 4. Optional Database Web GUI (Adminer)
  adminer:
    image: adminer:latest
    container_name: hrm_adminer
    restart: always
    ports:
      - "8082:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
